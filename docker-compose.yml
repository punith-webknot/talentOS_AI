services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentos
      POSTGRES_PASSWORD: talentos
      POSTGRES_DB: talentos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos -d talentos"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp:
    build: .
    command: ["uv", "run", "python", "Source/mcp_server/server.py"]
    environment:
      PORT: "8000"
      TALENTOS_API_BASE_URL: ${TALENTOS_API_BASE_URL:-}
      TALENTOS_API_TIMEOUT: ${TALENTOS_API_TIMEOUT:-30}
    ports:
      - "8002:8000"

  app:
    build: .
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      DATABASE_URI: postgresql://talentos:talentos@postgres:5432/talentos
      MCP_URL: http://mcp:8000/mcp
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_started

volumes:
  postgres_data:
